name: Compiler l'app iPhone

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode 26 (Liquid Glass)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Fabriquer les icones au choix
        working-directory: ios
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 tools/make_icons.py

      - name: Generer le projet Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compiler (sans signature, SideStore signera)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Mixtape.xcodeproj -target Mixtape -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES="$(cat build/alternate-icons.txt)" \
            build | xcbeautify || exit 1

      - name: Creer Mixtape.ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Mixtape.app Payload/
          zip -qry Mixtape.ipa Payload
          ls -lh Mixtape.ipa

      - name: Envoyer l'app sur le PC (copie de secours)
        continue-on-error: true
        env:
          MIXTAPE_URL: ${{ secrets.MIXTAPE_URL }}
          MIXTAPE_UPLOAD_KEY: ${{ secrets.MIXTAPE_UPLOAD_KEY }}
        run: |
          if [ -z "$MIXTAPE_URL" ] || [ -z "$MIXTAPE_UPLOAD_KEY" ]; then
            echo "Secrets MIXTAPE_URL / MIXTAPE_UPLOAD_KEY absents : envoi au PC ignore."
            exit 0
          fi
          URL="${MIXTAPE_URL%/}"
          URL="$(printf '%s' "$URL" | tr -d '[:space:]')"
          MESSAGE="$(git log -1 --format=%s | base64 | tr -d "\n")"
          {
            echo "### Envoi de l'app sur le PC"
            echo "- Test de l'adresse : $(curl -sS -o /dev/null -m 30 -w '%{http_code}' "$URL/app" 2>&1)"
          } >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/reponse.txt -m 180 -w '%{http_code}' -X POST \
              -H "X-Mixtape-Key: $MIXTAPE_UPLOAD_KEY" -H "X-Mixtape-Build: ${{ github.run_number }}" \
              -H "X-Mixtape-Message: $MESSAGE" \
              -H "Content-Type: application/octet-stream" --data-binary @ios/Mixtape.ipa \
              "$URL/app/upload" 2>/tmp/erreur.txt) || true
            echo "- Essai $i : code $code $(head -c 200 /tmp/erreur.txt) $(head -c 200 /tmp/reponse.txt)" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1

      - name: Fabriquer la source SideStore (mises a jour sans Safari)
        working-directory: ios
        env:
          BUILD: ${{ github.run_number }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          build = os.environ["BUILD"]
          repo = "https://github.com/kermiche78/mixtape"
          note = (os.environ.get("MESSAGE") or "Nouvelle version").splitlines()[0]
          source = {
            "name": "Mixtape",
            "identifier": "com.kermiche.mixtape.source",
            "subtitle": "Mon lecteur de musique privé",
            "iconURL": "https://raw.githubusercontent.com/kermiche78/mixtape/main/ios/Mixtape/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
            "apps": [{
              "name": "Mixtape",
              "bundleIdentifier": "com.kermiche.mixtape",
              "developerName": "Kermiche",
              "subtitle": "Ma musique, façon Apple Music",
              "localizedDescription": "Lecteur de musique privé relié au serveur de la maison.",
              "iconURL": "https://raw.githubusercontent.com/kermiche78/mixtape/main/ios/Mixtape/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
              "tintColor": "#FA2D48",
              "versions": [{
                "version": f"1.{build}",
                "buildVersion": build,
                "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                "localizedDescription": note,
                "downloadURL": f"{repo}/releases/download/build-{build}/Mixtape.ipa",
                "size": os.path.getsize("Mixtape.ipa"),
                "minOSVersion": "17.0"
              }],
              "appPermissions": {"entitlements": [], "privacy": {}}
            }],
            "news": []
          }
          json.dump(source, open("source.json", "w"), ensure_ascii=False, indent=2)
          PY
          cat source.json

      - uses: actions/upload-artifact@v4
        with:
          name: Mixtape-ipa
          path: ios/Mixtape.ipa

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mixtape (build ${{ github.run_number }})
          body: Fichier a installer avec SideStore.
          files: |
            ios/Mixtape.ipa
            ios/source.json
          make_latest: true
